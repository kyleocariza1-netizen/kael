```
<h2>Contact Me</h2>

<div class="contact-container">

    <div class="contact-info">

        <h3>Let's Connect!</h3>

        <p>
            If you want to contact me, you can send me
            a message using the form.
        </p>

        <p>
            Email: kyleocariza@example.com
        </p>

    </div>

    <form class="contact-form"
          action="https://formsubmit.co/kyleocariza@example.com"
          method="POST">

        <input
            type="text"
            name="name"
            placeholder="Your Name"
            required
        >

        <input
            type="email"
            name="email"
            placeholder="Your Email"
            required
        >

        <input
            type="text"
            name="subject"
            placeholder="Subject"
            required
        >

        <textarea
            name="message"
            placeholder="Your Message"
            required
        ></textarea>

        <button type="submit" class="btn">
            Send Message
        </button>

    </form>

</div>
```
